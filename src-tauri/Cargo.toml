[package]
name = "batbelt-desktop"
version = "1.2.0"
description = "macOS menubar wrapper for batbelt"
authors = ["lucaryholt"]
edition = "2021"

[lib]
name = "batbelt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
libc = "0.2"
url = "2"
